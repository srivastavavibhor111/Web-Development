<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laos Flag</title>
    <style>
        body{
            background-color: black;
        }
        .container{
            height: 500px;
            width: 700px;
            background-color: red;
            position: relative;
        }
        .rect{
            background-color: blue;
            height: 250px;
            width: 700px;
            position: absolute;
            top: 115px;
        }
        .circle{
            background-color: white;
            height: 230px;
            width: 230px;
            border-radius: 50%;
            position: absolute;
            top: 10px;
            left: 235px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="rect">
            <div class="circle">

            </div>
        </div>
    </div>
</body>
</html>
