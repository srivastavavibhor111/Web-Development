<!-- Login Form -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
        }
        body{
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box{
            width: 400px;
            /* height: 400px; */
            background-color: white;
            border-radius: 20px;
            padding: 60px;
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
            color:rgb(57, 57, 175);
        }

        label{
            font-size: 25px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        input{
            width: 100%;
            height: 30px;
            font-size: 20px;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        button{
            width: 100%;
            height: 60px;
            font-size: 30px;
            padding: 5px;
            color: white;
            background-color: rgb(246, 56, 56);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <form>
            <h1>Login</h1>

            <div>
                <label for="first">Username</label>
                <input type="text" id="first" placeholder="Enter your username">
            </div>
            <div>
                <label for="second">Password</label>
                <input type="text" id="second" placeholder="Enter you password">
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
