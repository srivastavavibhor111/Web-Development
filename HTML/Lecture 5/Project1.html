<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project1</title>
</head>
<body>
    <h1>University Registration Form</h1>
    <p>Please fill out the form beow to register.</p>
    <hr>

    <h2>Personal Details</h2>
    <label for="fname">First Name:</label>
    <input type="text" name="userfname" id="fname" placeholder="e.g.,Arjun">

    <br><br>

    <label for="lname">Last Name:</label>
    <input type="text" name="userlname" id="lname" placeholder="e.g.,Kumar">

    <br><br>

    <label for="dob">Date of Birth:</label>
    <input type="date" name="userdob" id="dob">

    <br><br>

    <p>Gender:</p>
    <input type="radio" name="gender" id="male">
    <label for="male">Male</label>
    

    <br>

    <input type="radio" name="gender" id="female">
    <label for="female">Female</label>

    <br>

    <input type="radio" name="gender" id="other">
    <label for="other">Other</label>

    <br><br>

    <label for="file">Upload Your Photo:</label>
    <input type="file" name="userphoto" id="file">

    <br><br>
    <hr>
    <br>

    <h2>Contact Information</h2>
    <br>

    <label for="email">Email Address:</label>
    <input type="email" name="useremail" id="email" placeholder="you@example.com">

    <br><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" name="userphone" id="phone" placeholder="e.g.,9876543210">

    <br><br>

    <label for="address">Mailing Address:</label>
    <textarea name="useraddress" id="address" rows="5" cols="30"placeholder="Street Address, City, State, ZIP Code"></textarea>

    <br><br>
    <hr>
    <br><br>

    <h2>Academic Information</h2>
    
    <br><br>

    <label for="course">Select your Course:</label>
    <select name="usercourse" id="course">
        <option value="null">-- Choose a course --</option>
        <option value="btech">B.Tech</option>
        <option value="mtech">M.Tech</option>
        <option value="mba">MBA</option>
        <option value="msc">M.Sc</option>
    </select>

    <br><br>

    <p>Extracurricular Interests:</p>

    <input type="checkbox" name="usersports" id="sports">
    <label for="sports">Sports</label>

    <br>

    <input type="checkbox" name="usermusic" id="music">
    <label for="music">Music & Arts</label>

    <br>

    <input type="checkbox" name="usertechnology" id="technology">
    <label for="technology">Technology Clubs</label>

    <br>

    <input type="checkbox" name="uservolunt" id="volunteering">
    <label for="volunteering">Volunteering</label>

    <br><br>
    <hr>
    <br><br>

    <h2>Create your Account</h2>
    <br><br>

    <label for="pass">Create a Password:</label>
    <input type="text" name="userpass" id="pass">

    <br><br>

    <label for="sques">Security Question:</label>
    <select name="usersques" id="sques">
        <option value="null">-- Choose a question --</option>
        <option value="pet">What was the name of your first pet?</option>
        <option value="school">What school did you attend for sixth grade?</option>
        <option value="mother">What is your mother's maiden name?</option>
    </select>

    <br><br>

    <label for="sans">Security Answer:</label>
    <input type="text" name="userans" id="sans">
    
    <br><br>

    <input type="checkbox" name="useragree" id="agree">
    <label for="agree">I agree to the Terms and Conditions.</label>

    <br><br>
    <hr>

    <button type="submit">Register</button>
    <button type="clear">Clear Form</button>
</body>
</html>
